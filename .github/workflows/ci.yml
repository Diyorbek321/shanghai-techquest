name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: techquest
          POSTGRES_PASSWORD: techquest
          POSTGRES_DB: techquest
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U techquest -d techquest"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://techquest:techquest@localhost:5432/techquest
      JWT_SECRET: ci-test-secret-do-not-use-in-production
      JWT_EXPIRES_IN: 7d
      COOKIE_SECURE: 'false'
      NODE_ENV: test
      GEMINI_API_KEY: ''

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run database migrations
        run: npx prisma migrate deploy

      - name: Lint (typecheck)
        run: npm run lint

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build
