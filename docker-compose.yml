services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: techquest
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-techquest}
      POSTGRES_DB: techquest
    # Bound to loopback only — reachable from the app container via the
    # compose network, not from the public internet. Put a reverse proxy
    # in front for a real deployment (see app's COOKIE_SECURE note below).
    ports:
      - '127.0.0.1:5435:5432'
    volumes:
      - techquest_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U techquest -d techquest']
      interval: 5s
      timeout: 5s
      retries: 10

  # Sandboxed code execution engine for the "Run" button in Masalalar/CodeLab
  # (src/server/code/piston.ts). Piston compiles/runs arbitrary student-submitted
  # code, so it needs a real process/syscall sandbox (isolate) — hence
  # `privileged: true` below. That is a materially larger blast radius than a
  # normal container, so:
  #   - it is NOT exposed publicly; only bound to loopback, and only the `app`
  #     container talks to it over the compose network (piston:2000).
  #   - the app's /api/problems/run route sits behind requireAuth + a
  #     dedicated tight rate limit (runCodeRateLimiter) specifically because
  #     this endpoint is more expensive/abusable than a normal API call.
  #   - runtime packages (this compose file installs Node, Python, and C++)
  #     are pinned to known versions on first boot; review before adding more.
  piston:
    image: ghcr.io/engineer-man/piston
    restart: unless-stopped
    privileged: true
    security_opt:
      - label:disable
    ports:
      - '127.0.0.1:2000:2000'
    volumes:
      - techquest_piston_packages:/piston/packages

  # One-shot: waits for piston to come up, then installs the language
  # runtimes src/server/code/piston.ts expects (javascript/python/c++).
  # Re-running `docker compose up` after the first boot is a fast no-op
  # (Piston's install endpoint is idempotent once a package is installed).
  piston-init:
    image: curlimages/curl:8.10.1
    restart: 'no'
    depends_on:
      - piston
    entrypoint: >-
      sh -c "
        until curl -sf http://piston:2000/api/v2/runtimes >/dev/null; do sleep 2; done;
        curl -sf -X POST -H 'Content-Type: application/json' -d '{\"language\":\"node\",\"version\":\"18.15.0\"}' http://piston:2000/api/v2/packages || true;
        curl -sf -X POST -H 'Content-Type: application/json' -d '{\"language\":\"python\",\"version\":\"3.10.0\"}' http://piston:2000/api/v2/packages || true;
        curl -sf -X POST -H 'Content-Type: application/json' -d '{\"language\":\"gcc\",\"version\":\"10.2.0\"}' http://piston:2000/api/v2/packages || true;
      "

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # Override values from .env that must point at the Docker network
      # hostname/internal port rather than the host-mapped ones.
      NODE_ENV: production
      DATABASE_URL: postgresql://techquest:${POSTGRES_PASSWORD:-techquest}@postgres:5432/techquest
      PISTON_URL: http://piston:2000
      # src/server/env.ts refuses to boot when NODE_ENV=production unless
      # COOKIE_SECURE=true (verified by running the built image). Note this
      # means the login cookie is marked Secure, so it will only be sent by
      # browsers over HTTPS -- put a TLS-terminating reverse proxy in front
      # of this container for a real deployment; plain http://localhost:3000
      # will not persist the login cookie.
      COOKIE_SECURE: 'true'
    ports:
      - '127.0.0.1:3000:3000'
    volumes:
      - techquest_uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      piston:
        condition: service_started

volumes:
  techquest_postgres_data:
  techquest_uploads:
  techquest_piston_packages:
